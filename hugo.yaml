baseURL: "https://mhassan.dev/"
title: "Muhammad Hassan Raza"
theme: "PaperMod"
locale: "en-US"
enableRobotsTXT: true

params:
  author: "Muhammad Hassan Raza"
  email: "hi@mhassan.dev"
  description: "Muhammad Hassan Raza runs product and engineering at Entropy Labs, builds backend and AI systems that hold up in production, and gets patches merged into open-source tools like kitty, calibre and libtorrent."
  env: production
  defaultTheme: auto
  mainSections: ["blog"]

  ShowReadingTime: true
  ShowBreadCrumbs: true
  ShowPostNavLinks: true
  ShowCodeCopyButtons: true
  ShowShareButtons: false
  ShowToc: false
  TocOpen: false

  assets:
    disableHLJS: true
    favicon: assets/favicon.svg
    favicon16x16: assets/favicon.svg
    favicon32x32: assets/favicon.svg
    apple_touch_icon: assets/favicon.svg
    safari_pinned_tab: assets/favicon.svg
    social_image: assets/social-card.png

  analytics:
    umami:
      scriptUrl: "https://cloud.umami.is/script.js"
      websiteId: "30c7d9d6-abac-4c52-b85a-c0234f863d22"

  schema:
    publisherType: "Person"
    jobTitle: "Cofounder and CIO, Entropy Labs"
    image: assets/social-card.png
    sameAs:
      - "https://github.com/m-hassan-raza"
      - "https://linkedin.com/in/hassanraza22"
      - "https://stackoverflow.com/users/14460053/m-hassan-raza"
      - "https://medium.com/@raihassanraza10"

  search:
    placeholder: "Search writing and work"

  giscus:
    repo: "M-Hassan-Raza/Portfolio"
    repoId: "R_kgDON3Oajw"
    category: "General"
    categoryId: "DIC_kwDON3Oaj84Cm3y9"
    mapping: "pathname"
    reactionsEnabled: "1"
    emitMetadata: "0"
    inputPosition: "bottom"
    lang: "en"

  socialIcons:
    - name: "github"
      url: "https://github.com/m-hassan-raza"
    - name: "linkedin"
      url: "https://linkedin.com/in/hassanraza22"
    - name: "email"
      url: "mailto:hi@mhassan.dev"

