baseURL: "https://mhassan.dev/"
title: "Muhammad Hassan Raza"
theme: "PaperMod"
defaultContentLanguage: "en"
languageCode: "en-us"

# Add this line to ignore the warning about the missing partial template
ignoreLogs: ["warning-partial-superfluous-prefix"]

params:
  author: "Muhammad Hassan Raza"
  description: "Muhammad Hassan Raza is a CPO and technical operator who leads product and engineering work for AI systems and backend platforms. He writes about production failures, architecture, and software judgment."
  keywords:
    [
      "technical leadership",
      "backend architecture",
      "AI systems",
      "product engineering",
      "production engineering",
      "software writing",
      "Lahore",
    ]
  ShowShareButtons: true
  ShowPostNavLinks: true
  assets:
    disableHLJS: true
    favicon: assets/favicon.svg
    favicon16x16: assets/favicon.svg
    favicon32x32: assets/favicon.svg
    apple_touch_icon: assets/favicon.svg
    safari_pinned_tab: assets/favicon.svg

  analytics:
    umami:
      scriptUrl: "https://cloud.umami.is/script.js"
      websiteId: "30c7d9d6-abac-4c52-b85a-c0234f863d22"

  schema:
    publisherType: "Person"
    jobTitle: "CPO and technical operator"
    sameAs:
      - "https://github.com/m-hassan-raza"
      - "https://linkedin.com/in/hassanraza22"
      - "https://stackoverflow.com/users/14460053/m-hassan-raza"
      - "https://medium.com/@raihassanraza10"

  # Show blog posts on the homepage (if any)
  mainSections: ["blog"]

  # Enable search and archive pages
  ShowReadingTime: true
  ShowBreadCrumbs: true
  ShowToc: true
  TocOpen: true
  ShowCodeCopyButtons: true
  env: production

  search:
    enabled: true
    placeholder: "Search posts, projects, and more..."

  giscus:
    repo: "M-Hassan-Raza/Portfolio"
    repoId: "R_kgDON3Oajw"
    category: "General"
    categoryId: "DIC_kwDON3Oaj84Cm3y9"
    mapping: "pathname"
    reactionsEnabled: "1"
    emitMetadata: "0"
    inputPosition: "bottom"
    lang: "en"

  socialIcons:
    - name: "github"
      url: "https://github.com/m-hassan-raza"
    - name: "linkedin"
      url: "https://linkedin.com/in/hassanraza22"
    - name: "email"
      url: "mailto:raihassanraza10@gmail.com"
    - name: "stackoverflow"
      url: "https://stackoverflow.com/users/14460053/m-hassan-raza"
    - name: "medium"
      url: "https://medium.com/@raihassanraza10"

