# Curated merged PRs. Facts come from the PR descriptions.
items:
  - repo: ludo-technologies/pyscn
    number: 391
    title: Make complete-linkage clone grouping fast
    note: Stopped rescanning every cluster pair after each merge and kept an
      indexed heap of neighbours instead. On 1,000 fragments it went from 11.1 s
      to 0.89 ms, and from 5.1 GB of memory to 1.2 MB, with parity checks against
      the slow version.
  - repo: docling-project/docling
    number: 3380
    title: Speed up layout and table cell matching
    note: Swapped a scan of every text cell per table cell for an R-tree lookup.
      Table text matching went from 2.4 s to 0.03 s on the benchmark in the PR.
  - repo: fallow-rs/fallow
    number: 2068
    title: Stop counting mocked modules as tested
    note: A test that swapped a module out with vi.mock was crediting the real
      module as covered, which hid coverage gaps. Proven mocks no longer count,
      and anything Fallow can't prove is left as it was.
  - repo: kovidgoyal/calibre
    number: 3148
    title: Protect rooted file paths from traversal
    note: One shared guard that keeps user-supplied paths inside the library root,
      used by the content server and extra-file operations.
  - repo: kovidgoyal/calibre
    number: 3143
    title: Apply book restrictions to search and data files
    note: Full-text search and extra data files on the content server ignored the
      signed-in user's book restriction. Both now check what that user is allowed
      to see.
  - repo: ludo-technologies/pyscn
    number: 695
    title: Make dependency analysis scale
    note: Replaced exhaustive path enumeration with one SCC-condensed pass. Django's
      908 files now analyze in about 1.2 seconds.
  - repo: tw93/Mole
    number: 1464
    title: Speed up clean and purge scans
    note: On my machine the largest purge root scan went from 30.1 s to 9.8 s, and
      a full purge dry run now finishes in about five minutes, where it hadn't
      finished in ten before.
  - repo: arvidn/libtorrent
    number: 8389
    title: Fix mmap disk jobs stranded behind fences
    note: Jobs released by a fence could land on a queue with no threads and stall.
      Now they route to a live pool or run inline.
  - repo: kovidgoyal/kitty
    number: 10038
    title: Avoid interpolating SSH login shell paths
    note: The SSH bootstrap built little Python and Perl programs by pasting paths
      into them. Now the paths travel as arguments.
