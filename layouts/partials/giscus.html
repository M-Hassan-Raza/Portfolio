{{- with site.Params.giscus }}
<div class="giscus-container">
    <script src="https://giscus.app/client.js"
        data-repo="{{ .repo }}"
        data-repo-id="{{ .repoId }}"
        data-category="{{ .category }}"
        data-category-id="{{ .categoryId }}"
        data-mapping="{{ .mapping | default "pathname" }}"
        data-strict="0"
        data-reactions-enabled="{{ .reactionsEnabled | default "1" }}"
        data-emit-metadata="{{ .emitMetadata | default "0" }}"
        data-input-position="{{ .inputPosition | default "bottom" }}"
        data-theme="preferred_color_scheme"
        data-lang="{{ .lang | default "en" }}"
        crossorigin="anonymous"
        async>
    </script>
</div>
<script>
    (function() {
        function getTheme() {
            const storedTheme = localStorage.getItem('pref-theme');
            if (storedTheme === 'dark' || storedTheme === 'light') {
                return storedTheme;
            }

            const currentTheme = document.documentElement.dataset.theme;
            if (currentTheme === 'dark' || currentTheme === 'light') {
                return currentTheme;
            }

            return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }

        function updateGiscusTheme() {
            const iframe = document.querySelector('iframe.giscus-frame');
            if (!iframe || !iframe.contentWindow) {
                return;
            }

            const theme = getTheme() === 'dark' ? 'transparent_dark' : 'noborder_light';
            iframe.contentWindow.postMessage(
                { giscus: { setConfig: { theme } } },
                'https://giscus.app'
            );
        }

        function bindGiscusFrame() {
            const iframe = document.querySelector('iframe.giscus-frame');
            if (!iframe) {
                return;
            }

            iframe.addEventListener('load', updateGiscusTheme, { once: true });
            updateGiscusTheme();
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', bindGiscusFrame, { once: true });
        } else {
            bindGiscusFrame();
        }

        const observer = new MutationObserver(function() {
            updateGiscusTheme();
        });

        observer.observe(document.documentElement, {
            attributes: true,
            attributeFilter: ['data-theme']
        });

        const mediaQuery = window.matchMedia('(prefers-color-scheme: dark)');
        if (mediaQuery.addEventListener) {
            mediaQuery.addEventListener('change', updateGiscusTheme);
        }
    })();
</script>
{{- end }}
