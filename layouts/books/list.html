{{- define "main" }}
<header class="page-header">
    <h1>{{ .Title }}</h1>
    {{- with .Description }}<p class="post-description">{{ . }}</p>{{ end }}
</header>

<div class="collection">
    <div class="work-grid work-grid-wide">
        {{- range .RegularPages.ByTitle }}
        <article class="work-card work-card-media">
            {{- partial "blog/cover-link.html" (dict "page" . "class" "work-card-cover") }}
            <div class="work-card-body">
                {{- with .Params.kicker }}<p class="kicker">{{ . }}</p>{{ end }}
                <h3><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3>
                <p>{{ .Description }}</p>
            </div>
        </article>
        {{- end }}
    </div>
</div>
{{- end }}
