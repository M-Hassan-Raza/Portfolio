<nav class="social-icons" role="navigation" aria-label="Social media links">
    {{- range site.Params.socialIcons }}
    <a href="{{ trim .url " " | safeURL }}"
       target="_blank"
       rel="noopener noreferrer me"
       aria-label="Visit {{ (.title | default .name) | title }}"
       title="{{ (.title | default .name) | title }}">
        {{ partial "svg.html" . }}
        <span class="sr-only">{{ (.title | default .name) | title }}</span>
    </a>
    {{- end }}
</nav>
