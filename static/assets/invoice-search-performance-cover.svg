<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <rect width="1200" height="630" fill="#F5F3EE"/>
  <rect x="52" y="52" width="1096" height="526" rx="28" fill="#FCFBF8" stroke="#DDD6CB"/>

  <text x="96" y="132" fill="#1F2937" font-family="Manrope, Arial, sans-serif" font-size="40" font-weight="700">Invoice search</text>
  <text x="96" y="170" fill="#667085" font-family="Manrope, Arial, sans-serif" font-size="20">Why preloading the product catalog beat firing an API call on every keystroke</text>

  <rect x="96" y="224" width="438" height="266" rx="24" fill="#1F2937"/>
  <text x="128" y="266" fill="#F8FAFC" font-family="Manrope, Arial, sans-serif" font-size="22" font-weight="700">Before</text>
  <rect x="128" y="312" width="374" height="48" rx="16" fill="#F8FAFC" fill-opacity="0.08" stroke="#9CA3AF" stroke-opacity="0.24"/>
  <text x="158" y="342" fill="#F8FAFC" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="600">t</text>
  <text x="212" y="342" fill="#F8FAFC" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="600">a</text>
  <text x="266" y="342" fill="#F8FAFC" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="600">b</text>
  <text x="328" y="342" fill="#F8FAFC" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="600">API</text>
  <text x="404" y="342" fill="#F8FAFC" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="600">DB</text>
  <path d="M178 336H198" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round"/>
  <path d="M232 336H252" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round"/>
  <path d="M286 336H316" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round"/>
  <path d="M362 336H390" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round"/>
  <text x="128" y="406" fill="#C5D1DE" font-family="Manrope, Arial, sans-serif" font-size="16">Every search hit the server again</text>
  <text x="128" y="442" fill="#F8FAFC" font-family="Manrope, Arial, sans-serif" font-size="28" font-weight="700">3 to 4 seconds</text>

  <path d="M558 356H626" stroke="#9CA3AF" stroke-width="3" stroke-linecap="round"/>
  <circle cx="592" cy="356" r="10" fill="#B45309"/>

  <rect x="642" y="224" width="458" height="266" rx="24" fill="#FFFFFF" stroke="#D8D0C4"/>
  <text x="674" y="266" fill="#1F2937" font-family="Manrope, Arial, sans-serif" font-size="22" font-weight="700">After</text>
  <rect x="674" y="312" width="178" height="44" rx="16" fill="#EEF2F7" stroke="#D8E0E8"/>
  <text x="714" y="340" fill="#374151" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="600">fetch once</text>
  <rect x="878" y="312" width="190" height="44" rx="16" fill="#EEF2F7" stroke="#D8E0E8"/>
  <text x="922" y="340" fill="#374151" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="600">local filter</text>
  <path d="M852 334H878" stroke="#9CA3AF" stroke-width="3" stroke-linecap="round"/>
  <rect x="674" y="392" width="394" height="30" rx="15" fill="#EEE7DB"/>
  <rect x="674" y="392" width="346" height="30" rx="15" fill="#B45309" fill-opacity="0.72"/>
  <text x="674" y="456" fill="#6B7280" font-family="Manrope, Arial, sans-serif" font-size="16">Bounded catalog, one initial fetch, instant search after that</text>

  <text x="96" y="598" fill="#6B7280" font-family="Manrope, Arial, sans-serif" font-size="18">The right performance fix was simpler than introducing a fancy search system</text>
</svg>
