<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <rect width="1200" height="630" fill="#F5F3EE"/>
  <rect x="52" y="52" width="1096" height="526" rx="28" fill="#FCFBF8" stroke="#DDD6CB"/>

  <text x="96" y="132" fill="#1F2937" font-family="Manrope, Arial, sans-serif" font-size="40" font-weight="700">Extract or copy-paste?</text>
  <text x="96" y="170" fill="#667085" font-family="Manrope, Arial, sans-serif" font-size="20">Wait until three real call sites share the same behavior</text>

  <rect x="96" y="224" width="320" height="266" rx="24" fill="#1F2937"/>
  <text x="128" y="266" fill="#F8FAFC" font-family="Manrope, Arial, sans-serif" font-size="22" font-weight="700">Too early</text>
  <rect x="128" y="314" width="256" height="42" rx="14" fill="#F8FAFC" fill-opacity="0.08" stroke="#9CA3AF" stroke-opacity="0.24"/>
  <text x="154" y="340" fill="#F8FAFC" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="600">ConfirmDialog</text>
  <rect x="128" y="372" width="256" height="42" rx="14" fill="#F8FAFC" fill-opacity="0.08" stroke="#9CA3AF" stroke-opacity="0.24"/>
  <text x="154" y="398" fill="#F8FAFC" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="600">mode</text>
  <text x="244" y="398" fill="#F8FAFC" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="600">slots</text>
  <text x="318" y="398" fill="#F8FAFC" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="600">props</text>
  <text x="128" y="452" fill="#C5D1DE" font-family="Manrope, Arial, sans-serif" font-size="16">One use case became four slightly different ones</text>

  <path d="M440 356H508" stroke="#9CA3AF" stroke-width="3" stroke-linecap="round"/>
  <circle cx="474" cy="356" r="10" fill="#1D4ED8"/>

  <rect x="524" y="224" width="320" height="266" rx="24" fill="#FFFFFF" stroke="#D8D0C4"/>
  <text x="556" y="266" fill="#1F2937" font-family="Manrope, Arial, sans-serif" font-size="22" font-weight="700">Good seam</text>
  <rect x="556" y="314" width="256" height="42" rx="14" fill="#EEF2F7" stroke="#D8E0E8"/>
  <text x="598" y="340" fill="#374151" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="600">PriceDisplay</text>
  <rect x="556" y="372" width="256" height="42" rx="14" fill="#EEF2F7" stroke="#D8E0E8"/>
  <text x="616" y="398" fill="#374151" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="600">amount</text>
  <text x="556" y="452" fill="#6B7280" font-family="Manrope, Arial, sans-serif" font-size="16">One job. One prop. Same behavior everywhere.</text>

  <path d="M868 356H936" stroke="#9CA3AF" stroke-width="3" stroke-linecap="round"/>
  <circle cx="902" cy="356" r="10" fill="#B45309"/>

  <rect x="952" y="224" width="148" height="266" rx="24" fill="#F8F3E8" stroke="#E0D4C1"/>
  <text x="982" y="266" fill="#1F2937" font-family="Manrope, Arial, sans-serif" font-size="22" font-weight="700">Rule</text>
  <rect x="980" y="324" width="92" height="92" rx="24" fill="#FFFFFF" stroke="#E5D8C5"/>
  <text x="1016" y="366" fill="#9A3412" font-family="Manrope, Arial, sans-serif" font-size="28" font-weight="700">3</text>
  <text x="998" y="394" fill="#9A3412" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="700">call sites</text>

  <text x="96" y="598" fill="#6B7280" font-family="Manrope, Arial, sans-serif" font-size="18">Abstractions earn their place after repeated, stable use, not after one tidy refactor</text>
