<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <rect width="1200" height="630" fill="#fafafa"/>

  <!-- Subtle grid that gets disrupted -->
  <g stroke="#e4e4e7" stroke-width="1">
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
    <line x1="0" y1="126" x2="1200" y2="126"/>
    <line x1="0" y1="252" x2="1200" y2="252"/>
    <line x1="0" y1="378" x2="1200" y2="378"/>
    <line x1="0" y1="504" x2="1200" y2="504"/>
  </g>

  <!-- Disrupted/glitched elements - the "break" -->
  <rect x="380" y="230" width="120" height="80" fill="#b5836d" opacity="0.15" rx="4"/>
  <rect x="390" y="240" width="120" height="80" fill="#b5836d" opacity="0.25" rx="4"/>
  <rect x="400" y="250" width="120" height="80" fill="#b5836d" opacity="0.12" rx="4"/>

  <!-- Shifted grid lines in disruption zone -->
  <line x1="395" y1="230" x2="415" y2="340" stroke="#b5836d" stroke-width="1.5" opacity="0.6"/>
  <line x1="595" y1="230" x2="615" y2="340" stroke="#b5836d" stroke-width="1.5" opacity="0.6"/>

  <!-- Terminal cursor blinking -->
  <rect x="560" y="290" width="80" height="3" fill="#b5836d" opacity="0.8" rx="1"/>

  <!-- Scattered error indicators -->
  <circle cx="700" cy="180" r="4" fill="#b5836d" opacity="0.4"/>
  <circle cx="720" cy="420" r="3" fill="#b5836d" opacity="0.3"/>
  <circle cx="340" cy="460" r="5" fill="#b5836d" opacity="0.25"/>
  <circle cx="880" cy="300" r="3.5" fill="#b5836d" opacity="0.35"/>

  <!-- Subtle diagonal disruption lines -->
  <line x1="450" y1="200" x2="750" y2="430" stroke="#b5836d" stroke-width="0.75" opacity="0.2"/>
  <line x1="460" y1="200" x2="760" y2="430" stroke="#b5836d" stroke-width="0.75" opacity="0.15"/>
</svg>
