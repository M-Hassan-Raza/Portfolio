  <text x="154" y="389" fill="#991B1B" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="700">signal fires</text>
  <rect x="128" y="420" width="214" height="42" rx="16" fill="#FEF2F2" stroke="#F0C9C9"/>
  <text x="154" y="447" fill="#991B1B" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="700">recalc again</text>

  <rect x="422" y="224" width="370" height="258" rx="24" fill="#1F2937"/>
