  <text x="898" y="456" fill="#9A3412" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="700">Cleaner ledger state</text>

  <text x="96" y="598" fill="#6B7280" font-family="Manrope, Arial, sans-serif" font-size="18">Mark the ledger, wait for commit, and recalculate once instead of letting every save trigger work</text>
