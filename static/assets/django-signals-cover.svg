  <text x="480" y="331" fill="#F8FAFC" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="600">mark _needs_recalc</text>
  <rect x="454" y="362" width="306" height="42" rx="16" fill="#F8FAFC" fill-opacity="0.08" stroke="#9CA3AF" stroke-opacity="0.24"/>
  <text x="480" y="389" fill="#F8FAFC" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="600">wait for on_commit()</text>
  <rect x="454" y="420" width="306" height="42" rx="16" fill="#F8FAFC" fill-opacity="0.08" stroke="#9CA3AF" stroke-opacity="0.24"/>
  <text x="480" y="447" fill="#F8FAFC" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="600">recalculate once</text>

  <path d="M374 353H422" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round"/>
  <circle cx="398" cy="353" r="10" fill="#B45309"/>

  <rect x="840" y="224" width="260" height="258" rx="24" fill="#F8F3E8" stroke="#E2D4C1"/>
