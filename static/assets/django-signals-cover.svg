<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <rect width="1200" height="630" fill="#F5F3EE"/>
  <rect x="52" y="52" width="1096" height="526" rx="28" fill="#FCFBF8" stroke="#DED6CA"/>

  <text x="96" y="132" fill="#1F2937" font-family="Manrope, Arial, sans-serif" font-size="40" font-weight="700">Optimizing Django signals</text>
  <text x="96" y="170" fill="#667085" font-family="Manrope, Arial, sans-serif" font-size="20">Ledger recalculation without signal storms</text>

