<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <rect width="1200" height="630" fill="#F5F3EE"/>
  <rect x="52" y="52" width="1096" height="526" rx="28" fill="#FCFBF8" stroke="#DDD6CB"/>

  <text x="96" y="132" fill="#1F2937" font-family="Manrope, Arial, sans-serif" font-size="40" font-weight="700">Structured logging</text>
  <text x="96" y="170" fill="#667085" font-family="Manrope, Arial, sans-serif" font-size="20">One wide event is easier to debug than a pile of scattered log lines</text>

  <rect x="96" y="224" width="272" height="266" rx="24" fill="#1F2937"/>
  <text x="128" y="266" fill="#F8FAFC" font-family="Manrope, Arial, sans-serif" font-size="22" font-weight="700">console.log sprawl</text>
  <text x="128" y="318" fill="#D5DEE8" font-family="IBM Plex Mono, Menlo, monospace" font-size="15">INFO Processing order</text>
  <text x="128" y="350" fill="#D5DEE8" font-family="IBM Plex Mono, Menlo, monospace" font-size="15">DEBUG Fetching inventory</text>
  <text x="128" y="382" fill="#D5DEE8" font-family="IBM Plex Mono, Menlo, monospace" font-size="15">WARN Inventory low</text>
  <text x="128" y="414" fill="#D5DEE8" font-family="IBM Plex Mono, Menlo, monospace" font-size="15">ERROR Failed to notify</text>
  <text x="128" y="456" fill="#C5D1DE" font-family="Manrope, Arial, sans-serif" font-size="16">Hard to correlate. Easy to miss context.</text>

  <path d="M392 356H480" stroke="#9CA3AF" stroke-width="3" stroke-linecap="round"/>
  <circle cx="436" cy="356" r="10" fill="#1D4ED8"/>

  <rect x="496" y="224" width="336" height="266" rx="24" fill="#FFFFFF" stroke="#D8D0C4"/>
  <text x="528" y="266" fill="#1F2937" font-family="Manrope, Arial, sans-serif" font-size="22" font-weight="700">Wide event</text>
  <rect x="528" y="304" width="272" height="146" rx="18" fill="#EEF2F7" stroke="#D8E0E8"/>
  <text x="554" y="336" fill="#374151" font-family="IBM Plex Mono, Menlo, monospace" font-size="15">{"message":"POST /orders"}</text>
  <text x="554" y="366" fill="#374151" font-family="IBM Plex Mono, Menlo, monospace" font-size="15">{"orderId":12345}</text>
  <text x="554" y="396" fill="#374151" font-family="IBM Plex Mono, Menlo, monospace" font-size="15">{"duration":847}</text>
  <text x="554" y="426" fill="#374151" font-family="IBM Plex Mono, Menlo, monospace" font-size="15">{"lowStock":true}</text>

  <path d="M856 356H944" stroke="#9CA3AF" stroke-width="3" stroke-linecap="round"/>
  <circle cx="900" cy="356" r="10" fill="#B45309"/>

  <rect x="960" y="224" width="140" height="266" rx="24" fill="#F8F3E8" stroke="#E0D4C1"/>
  <text x="992" y="266" fill="#1F2937" font-family="Manrope, Arial, sans-serif" font-size="22" font-weight="700">AI</text>
  <rect x="992" y="314" width="76" height="36" rx="14" fill="#FFFFFF" stroke="#E5D8C5"/>
  <text x="1012" y="337" fill="#9A3412" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="700">why</text>
  <rect x="992" y="370" width="76" height="36" rx="14" fill="#FFFFFF" stroke="#E5D8C5"/>
  <text x="1012" y="393" fill="#9A3412" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="700">fix</text>
  <rect x="992" y="426" width="76" height="36" rx="14" fill="#FEF3C7"/>
  <text x="1008" y="449" fill="#92400E" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="700">context</text>

  <text x="96" y="598" fill="#6B7280" font-family="Manrope, Arial, sans-serif" font-size="18">Correlated JSON events give both humans and models a much cleaner debugging trail</text>
</svg>
