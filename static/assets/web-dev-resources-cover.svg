<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <rect width="1200" height="630" fill="#F5F3EE"/>
  <rect x="52" y="52" width="1096" height="526" rx="28" fill="#FCFBF8" stroke="#DED6CA"/>

  <text x="96" y="132" fill="#1F2937" font-family="Manrope, Arial, sans-serif" font-size="40" font-weight="700">Free web dev platforms worth your time</text>
  <text x="96" y="170" fill="#667085" font-family="Manrope, Arial, sans-serif" font-size="20">Pick one, finish it, then build outside the curriculum</text>

  <rect x="96" y="230" width="300" height="250" rx="24" fill="#FFFFFF" stroke="#D8D0C4"/>
  <text x="128" y="272" fill="#1F2937" font-family="Manrope, Arial, sans-serif" font-size="22" font-weight="700">freeCodeCamp</text>
  <text x="128" y="304" fill="#667085" font-family="Manrope, Arial, sans-serif" font-size="16">Best all-around</text>
  <rect x="128" y="342" width="236" height="40" rx="16" fill="#EEF2F7" stroke="#D8E0E8"/>
  <text x="154" y="368" fill="#374151" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="600">Project-based</text>
  <rect x="128" y="394" width="236" height="40" rx="16" fill="#EEF2F7" stroke="#D8E0E8"/>
  <text x="154" y="420" fill="#374151" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="600">Strong beginner path</text>

  <rect x="450" y="230" width="300" height="250" rx="24" fill="#1F2937"/>
  <text x="482" y="272" fill="#F8FAFC" font-family="Manrope, Arial, sans-serif" font-size="22" font-weight="700">The Odin Project</text>
  <text x="482" y="304" fill="#C5D1DE" font-family="Manrope, Arial, sans-serif" font-size="16">Best for learning to learn</text>
  <rect x="482" y="342" width="236" height="40" rx="16" fill="#F8FAFC" fill-opacity="0.08" stroke="#9CA3AF" stroke-opacity="0.24"/>
  <text x="508" y="368" fill="#F8FAFC" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="600">Docs first</text>
  <rect x="482" y="394" width="236" height="40" rx="16" fill="#F8FAFC" fill-opacity="0.08" stroke="#9CA3AF" stroke-opacity="0.24"/>
  <text x="508" y="420" fill="#F8FAFC" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="600">Portfolio through projects</text>

  <rect x="804" y="230" width="296" height="250" rx="24" fill="#F8F3E8" stroke="#E2D4C1"/>
  <text x="836" y="272" fill="#1F2937" font-family="Manrope, Arial, sans-serif" font-size="22" font-weight="700">Full Stack Open</text>
  <text x="836" y="304" fill="#7C6F5E" font-family="Manrope, Arial, sans-serif" font-size="16">Best for depth</text>
  <rect x="836" y="342" width="232" height="40" rx="16" fill="#FFFFFF" stroke="#E5D8C5"/>
  <text x="862" y="368" fill="#9A3412" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="700">University-level</text>
  <rect x="836" y="394" width="232" height="40" rx="16" fill="#FFFFFF" stroke="#E5D8C5"/>
  <text x="862" y="420" fill="#9A3412" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="700">Harder, deeper stack</text>

  <text x="96" y="598" fill="#6B7280" font-family="Manrope, Arial, sans-serif" font-size="18">The win is not finding a perfect curriculum. The win is finishing one and building real projects after it.</text>
</svg>
