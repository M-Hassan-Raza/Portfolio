<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <rect width="1200" height="630" fill="#fafafa"/>

  <!-- App/interface mockup - clean and functional -->
  <g>
    <!-- Left side: good UI (simple, clean) -->
    <rect x="120" y="140" width="400" height="350" rx="8" stroke="#d4d4d8" stroke-width="1.5" fill="white"/>

    <!-- Title bar -->
    <rect x="120" y="140" width="400" height="36" rx="8" fill="#f4f4f5"/>
    <rect x="120" y="168" width="400" height="8" fill="#f4f4f5"/>
    <circle cx="142" cy="158" r="5" fill="#d4d4d8"/>
    <circle cx="160" cy="158" r="5" fill="#d4d4d8"/>
    <circle cx="178" cy="158" r="5" fill="#d4d4d8"/>

    <!-- Clean form fields -->
    <rect x="150" y="200" width="340" height="32" rx="4" stroke="#e4e4e7" stroke-width="1" fill="none"/>
    <rect x="162" y="212" width="80" height="3" rx="1" fill="#d4d4d8"/>

    <rect x="150" y="250" width="340" height="32" rx="4" stroke="#e4e4e7" stroke-width="1" fill="none"/>
    <rect x="162" y="262" width="120" height="3" rx="1" fill="#d4d4d8"/>

    <rect x="150" y="300" width="340" height="32" rx="4" stroke="#e4e4e7" stroke-width="1" fill="none"/>
    <rect x="162" y="312" width="60" height="3" rx="1" fill="#d4d4d8"/>

    <!-- Clean button -->
    <rect x="150" y="360" width="100" height="32" rx="4" fill="#71717a" fill-opacity="0.1" stroke="#71717a" stroke-width="1"/>
    <rect x="172" y="373" width="56" height="3" rx="1" fill="#71717a" opacity="0.5"/>

    <!-- Checkmarks next to fields (pre-filled by AI, invisibly) -->
    <g fill="#b5836d" opacity="0.4">
      <circle cx="504" cy="216" r="8"/>
      <path d="M500 216l3 3 6-6" stroke="white" stroke-width="1.5" fill="none"/>
    </g>
    <g fill="#b5836d" opacity="0.4">
      <circle cx="504" cy="266" r="8"/>
      <path d="M500 266l3 3 6-6" stroke="white" stroke-width="1.5" fill="none"/>
    </g>

    <!-- Right side: AI chatbot overlay (the wrong approach) -->
    <rect x="680" y="140" width="400" height="350" rx="8" stroke="#d4d4d8" stroke-width="1.5" fill="white"/>

    <!-- Title bar -->
    <rect x="680" y="140" width="400" height="36" rx="8" fill="#f4f4f5"/>
    <rect x="680" y="168" width="400" height="8" fill="#f4f4f5"/>
    <circle cx="702" cy="158" r="5" fill="#d4d4d8"/>
    <circle cx="720" cy="158" r="5" fill="#d4d4d8"/>
    <circle cx="738" cy="158" r="5" fill="#d4d4d8"/>

    <!-- Chat bubbles - messy, long, unhelpful -->
    <rect x="710" y="200" width="220" height="45" rx="12" fill="#f4f4f5"/>
    <rect x="722" y="212" width="140" height="3" rx="1" fill="#d4d4d8"/>
    <rect x="722" y="222" width="180" height="3" rx="1" fill="#d4d4d8"/>
    <rect x="722" y="232" width="100" height="3" rx="1" fill="#d4d4d8"/>

    <rect x="830" y="260" width="220" height="30" rx="12" fill="#b5836d" fill-opacity="0.1"/>
    <rect x="842" y="272" width="120" height="3" rx="1" fill="#b5836d" opacity="0.3"/>

    <rect x="710" y="305" width="250" height="60" rx="12" fill="#f4f4f5"/>
    <rect x="722" y="317" width="180" height="3" rx="1" fill="#d4d4d8"/>
    <rect x="722" y="327" width="210" height="3" rx="1" fill="#d4d4d8"/>
    <rect x="722" y="337" width="150" height="3" rx="1" fill="#d4d4d8"/>
    <rect x="722" y="347" width="190" height="3" rx="1" fill="#d4d4d8"/>

    <!-- Loading dots (latency) -->
    <circle cx="730" cy="400" r="4" fill="#d4d4d8" opacity="0.6"/>
    <circle cx="745" cy="400" r="4" fill="#d4d4d8" opacity="0.4"/>
    <circle cx="760" cy="400" r="4" fill="#d4d4d8" opacity="0.2"/>

    <!-- Input bar at bottom -->
    <rect x="710" y="440" width="340" height="28" rx="14" stroke="#e4e4e7" stroke-width="1" fill="none"/>
    <rect x="726" y="451" width="100" height="3" rx="1" fill="#d4d4d8" opacity="0.4"/>
  </g>

  <!-- Subtle "vs" or divider -->
  <line x1="600" y1="180" x2="600" y2="460" stroke="#e4e4e7" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Subtle terracotta X over chatbot side -->
  <g stroke="#b5836d" stroke-width="1" opacity="0.15">
    <line x1="700" y1="160" x2="1060" y2="470"/>
    <line x1="1060" y1="160" x2="700" y2="470"/>
  </g>
</svg>
