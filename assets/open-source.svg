<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <rect width="1200" height="630" fill="#fafafa"/>

  <!-- Abstract wrench/tool shape composed of geometric elements -->
  <g opacity="0.9">
    <!-- Scattered code block shapes - different sizes, like different projects -->
    <rect x="160" y="180" width="140" height="90" rx="6" stroke="#e4e4e7" stroke-width="1.5" fill="none"/>
    <rect x="165" y="195" width="60" height="3" rx="1" fill="#d4d4d8"/>
    <rect x="165" y="205" width="90" height="3" rx="1" fill="#d4d4d8"/>
    <rect x="165" y="215" width="45" height="3" rx="1" fill="#d4d4d8"/>
    <rect x="165" y="225" width="75" height="3" rx="1" fill="#b5836d" opacity="0.6"/>
    <rect x="165" y="235" width="55" height="3" rx="1" fill="#d4d4d8"/>

    <rect x="420" y="120" width="140" height="90" rx="6" stroke="#e4e4e7" stroke-width="1.5" fill="none"/>
    <rect x="425" y="135" width="80" height="3" rx="1" fill="#d4d4d8"/>
    <rect x="425" y="145" width="50" height="3" rx="1" fill="#d4d4d8"/>
    <rect x="425" y="155" width="100" height="3" rx="1" fill="#b5836d" opacity="0.6"/>
    <rect x="425" y="165" width="65" height="3" rx="1" fill="#d4d4d8"/>
    <rect x="425" y="175" width="40" height="3" rx="1" fill="#d4d4d8"/>

    <rect x="680" y="200" width="140" height="90" rx="6" stroke="#e4e4e7" stroke-width="1.5" fill="none"/>
    <rect x="685" y="215" width="70" height="3" rx="1" fill="#d4d4d8"/>
    <rect x="685" y="225" width="100" height="3" rx="1" fill="#d4d4d8"/>
    <rect x="685" y="235" width="55" height="3" rx="1" fill="#d4d4d8"/>
    <rect x="685" y="245" width="85" height="3" rx="1" fill="#b5836d" opacity="0.6"/>
    <rect x="685" y="255" width="60" height="3" rx="1" fill="#d4d4d8"/>

    <rect x="940" y="140" width="140" height="90" rx="6" stroke="#e4e4e7" stroke-width="1.5" fill="none"/>
    <rect x="945" y="155" width="55" height="3" rx="1" fill="#d4d4d8"/>
    <rect x="945" y="165" width="90" height="3" rx="1" fill="#b5836d" opacity="0.6"/>
    <rect x="945" y="175" width="70" height="3" rx="1" fill="#d4d4d8"/>
    <rect x="945" y="185" width="45" height="3" rx="1" fill="#d4d4d8"/>

    <!-- Bottom row -->
    <rect x="280" y="380" width="140" height="90" rx="6" stroke="#e4e4e7" stroke-width="1.5" fill="none"/>
    <rect x="285" y="395" width="75" height="3" rx="1" fill="#d4d4d8"/>
    <rect x="285" y="405" width="50" height="3" rx="1" fill="#b5836d" opacity="0.6"/>
    <rect x="285" y="415" width="95" height="3" rx="1" fill="#d4d4d8"/>
    <rect x="285" y="425" width="60" height="3" rx="1" fill="#d4d4d8"/>

    <rect x="560" y="400" width="140" height="90" rx="6" stroke="#e4e4e7" stroke-width="1.5" fill="none"/>
    <rect x="565" y="415" width="65" height="3" rx="1" fill="#d4d4d8"/>
    <rect x="565" y="425" width="85" height="3" rx="1" fill="#d4d4d8"/>
    <rect x="565" y="435" width="110" height="3" rx="1" fill="#b5836d" opacity="0.6"/>
    <rect x="565" y="445" width="50" height="3" rx="1" fill="#d4d4d8"/>

    <rect x="830" y="360" width="140" height="90" rx="6" stroke="#e4e4e7" stroke-width="1.5" fill="none"/>
    <rect x="835" y="375" width="90" height="3" rx="1" fill="#d4d4d8"/>
    <rect x="835" y="385" width="60" height="3" rx="1" fill="#d4d4d8"/>
    <rect x="835" y="395" width="80" height="3" rx="1" fill="#b5836d" opacity="0.6"/>
    <rect x="835" y="405" width="45" height="3" rx="1" fill="#d4d4d8"/>
  </g>

  <!-- Connection lines between code blocks (contributions flow) -->
  <g stroke="#b5836d" stroke-width="1" opacity="0.25">
    <line x1="300" y1="270" x2="420" y2="165"/>
    <line x1="560" y1="165" x2="680" y2="245"/>
    <line x1="820" y1="245" x2="940" y2="185"/>
    <line x1="230" y1="270" x2="350" y2="380"/>
    <line x1="420" y1="425" x2="560" y2="445"/>
    <line x1="700" y1="430" x2="830" y2="405"/>
  </g>
</svg>
