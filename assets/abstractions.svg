<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <rect width="1200" height="630" fill="#fafafa"/>

  <!-- Stacked layers that progressively become more complex and less useful -->

  <!-- Bottom layer - simple, solid, good -->
  <rect x="300" y="420" width="600" height="60" rx="6" stroke="#71717a" stroke-width="1.5" fill="#71717a" fill-opacity="0.06"/>
  <rect x="320" y="440" width="160" height="3" rx="1" fill="#71717a" opacity="0.3"/>
  <rect x="320" y="450" width="100" height="3" rx="1" fill="#71717a" opacity="0.3"/>
  <rect x="320" y="460" width="130" height="3" rx="1" fill="#71717a" opacity="0.3"/>

  <!-- Middle layer -->
  <rect x="340" y="330" width="520" height="60" rx="6" stroke="#a1a1aa" stroke-width="1.5" fill="#a1a1aa" fill-opacity="0.05"/>
  <rect x="360" y="345" width="120" height="3" rx="1" fill="#a1a1aa" opacity="0.25"/>
  <rect x="360" y="355" width="80" height="3" rx="1" fill="#a1a1aa" opacity="0.25"/>
  <rect x="360" y="365" width="150" height="3" rx="1" fill="#a1a1aa" opacity="0.25"/>

  <!-- Upper layer - getting thinner -->
  <rect x="380" y="240" width="440" height="60" rx="6" stroke="#d4d4d8" stroke-width="1.5" fill="#d4d4d8" fill-opacity="0.04"/>
  <rect x="400" y="255" width="100" height="3" rx="1" fill="#d4d4d8" opacity="0.3"/>
  <rect x="400" y="265" width="140" height="3" rx="1" fill="#d4d4d8" opacity="0.3"/>
  <rect x="400" y="275" width="60" height="3" rx="1" fill="#d4d4d8" opacity="0.3"/>

  <!-- Top layer - the over-abstraction, with terracotta "warning" -->
  <rect x="420" y="150" width="360" height="60" rx="6" stroke="#b5836d" stroke-width="1.5" fill="#b5836d" fill-opacity="0.06" stroke-dasharray="6 4"/>
  <rect x="440" y="165" width="90" height="3" rx="1" fill="#b5836d" opacity="0.3"/>
  <rect x="440" y="175" width="120" height="3" rx="1" fill="#b5836d" opacity="0.3"/>
  <rect x="440" y="185" width="70" height="3" rx="1" fill="#b5836d" opacity="0.3"/>

  <!-- Dashed lines showing unnecessary indirection -->
  <g stroke="#b5836d" stroke-width="1" stroke-dasharray="4 3" opacity="0.3">
    <line x1="600" y1="210" x2="600" y2="240"/>
    <line x1="600" y1="300" x2="600" y2="330"/>
    <line x1="600" y1="390" x2="600" y2="420"/>
  </g>

  <!-- Arrow pointing down from complex to simple -->
  <g opacity="0.15">
    <line x1="160" y1="180" x2="160" y2="450" stroke="#b5836d" stroke-width="2"/>
    <line x1="160" y1="450" x2="150" y2="435" stroke="#b5836d" stroke-width="2"/>
    <line x1="160" y1="450" x2="170" y2="435" stroke="#b5836d" stroke-width="2"/>
  </g>

  <!-- Small "X" marks on top layer suggesting deletion -->
  <g stroke="#b5836d" stroke-width="1.5" opacity="0.25">
    <line x1="740" y1="160" x2="760" y2="180"/>
    <line x1="760" y1="160" x2="740" y2="180"/>
  </g>
</svg>
